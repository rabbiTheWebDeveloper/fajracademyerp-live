<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fajr Academy — No Connection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0A1931 0%, #132847 100%);
      color: white;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; background: white; }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1rem;
      color: rgba(255,255,255,0.65);
      max-width: 360px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.85;
    }
    button {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.75rem 2rem;
      border-radius: 100px;
      cursor: pointer;
      transition: background 0.2s;
      backdrop-filter: blur(10px);
    }
    button:hover { background: rgba(255,255,255,0.25); }
    .badge {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <div class="logo">
    <img src="/logo.png" alt="Fajr Academy Logo" />
  </div>
  <h1>You're Offline</h1>
  <p>
    Please check your internet connection and try again. Some cached pages may still be available.
  </p>
  <button onclick="window.location.reload()">Try Again</button>
  <p class="badge">Fajr Academy ERP</p>
</body>
</html>
